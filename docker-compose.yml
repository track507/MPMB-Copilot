version: "3.8"

services:
    # Vector Database
    qdrant:
        image: qdrant/qdrant:latest
        container_name: mpmb-qdrant
        ports:
            - "6333:6333" # REST API
            - "6334:6334" # gRPC
        volumes:
            - qdrant_storage:/qdrant/storage
        environment:
            - QDRANT__SERVICE__GRPC_PORT=6334
        restart: unless-stopped
        networks:
            - mpmb-network

    # Python FastAPI Backend
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: mpmb-backend
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
            - ./data:/app/data # For MPMB source files
        environment:
            - QDRANT_HOST=qdrant
            - QDRANT_PORT=6333
            - ENVIRONMENT=development
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
            - OPENAI_API_KEY=${OPENAI_API_KEY:-}
            - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
        env_file:
            - .env
        depends_on:
            - qdrant
        restart: unless-stopped
        networks:
            - mpmb-network
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    # C# SignalR Hub
    hub:
        build:
            context: ./hub
            dockerfile: Dockerfile
        container_name: mpmb-hub
        ports:
            - "5000:5000"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://+:5000
            - PythonBackend__BaseUrl=http://backend:8000
            - AllowedOrigins__0=http://localhost:3000
            - AllowedOrigins__1=http://localhost:5001
        depends_on:
            - backend
        restart: unless-stopped
        networks:
            - mpmb-network

    # Blazor WebAssembly Frontend (optional - can run separately)
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: mpmb-frontend
        ports:
            - "3000:80"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - HubUrl=http://localhost:5000/chathub
        depends_on:
            - hub
        restart: unless-stopped
        networks:
            - mpmb-network

networks:
    mpmb-network:
        driver: bridge

volumes:
    qdrant_storage:
        driver: local
