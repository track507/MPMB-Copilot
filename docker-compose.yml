services:
    # PostgreSQL Database for Session Persistence
    postgres:
        image: postgres:16-alpine
        container_name: mpmb-postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./scripts:/docker-entrypoint-initdb.d:ro
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-mpmb_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpmb_password}
            POSTGRES_DB: ${POSTGRES_DB:-mpmb_copilot}
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpmb_user} -d ${POSTGRES_DB:-mpmb_copilot}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - mpmb-network

    # Qdrant Vector Database
    qdrant:
        image: qdrant/qdrant:latest
        container_name: mpmb-qdrant
        ports:
            - "6333:6333" # REST API
            - "6334:6334" # gRPC
        volumes:
            - qdrant_storage:/qdrant/storage
            - qdrant_snapshots:/qdrant/snapshots
        environment:
            - QDRANT__SERVICE__GRPC_PORT=6334
            - QDRANT__LOG_LEVEL=INFO
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - mpmb-network

    # Python FastAPI Backend (Updated to 3.13)
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            args:
                PYTHON_VERSION: "3.13"
        container_name: mpmb-backend
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
            - ./data:/app/data
            - backend_logs:/app/logs
        environment:
            # Application
            - ENVIRONMENT=development
            - LOG_LEVEL=INFO
            - DEBUG=true

            # Database
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_USER=${POSTGRES_USER:-mpmb_user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mpmb_password}
            - POSTGRES_DB=${POSTGRES_DB:-mpmb_copilot}
            - DATABASE_URL=postgresql://${POSTGRES_USER:-mpmb_user}:${POSTGRES_PASSWORD:-mpmb_password}@postgres:5432/${POSTGRES_DB:-mpmb_copilot}

            # Qdrant
            - QDRANT_HOST=qdrant
            - QDRANT_PORT=6333
            - QDRANT_COLLECTION=mpmb_code

            # LLM Providers
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
            - OPENAI_API_KEY=${OPENAI_API_KEY:-}
            - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
            - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-anthropic}
            - DEFAULT_MODEL=${DEFAULT_MODEL:-claude-sonnet-4-20250514}
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            qdrant:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - mpmb-network
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

