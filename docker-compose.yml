networks:
    mpmb-network:
        driver: bridge
        name: mpmb-network

volumes:
    # PostgreSQL persistent storage
    postgres_data:
        driver: local
        name: mpmb_postgres_data

    # Qdrant persistent storage
    qdrant_storage:
        driver: local
        name: mpmb_qdrant_storage

    qdrant_snapshots:
        driver: local
        name: mpmb_qdrant_snapshots

    # Application logs
    backend_logs:
        driver: local
        name: mpmb_backend_logs

    hub_logs:
        driver: local
        name: mpmb_hub_logs
