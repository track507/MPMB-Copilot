services:
    # PostgreSQL Database for Session Persistence
    postgres:
        build:
            context: ./docker/postgres
            dockerfile: Dockerfile
        container_name: mpmb-postgres
        ports:
            # Use a non-default host port by default so local PostgreSQL installs
            # don't intercept development traffic intended for the Docker service.
            - "${POSTGRES_HOST_PORT:-5433}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-mpmb_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpmb_password}
            POSTGRES_DB: ${POSTGRES_DB:-mpmb_copilot}
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpmb_user} -d ${POSTGRES_DB:-mpmb_copilot}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - mpmb-network

    # Qdrant Vector Database
    qdrant:
        image: qdrant/qdrant:latest
        container_name: mpmb-qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - qdrant_storage:/qdrant/storage
            - qdrant_snapshots:/qdrant/snapshots
        environment:
            - QDRANT__SERVICE__GRPC_PORT=6334
            - QDRANT__LOG_LEVEL=INFO
        healthcheck:
            test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - mpmb-network

    # Python FastAPI Backend (Updated to 3.13)
    backend:
        build:
            context: .
            dockerfile: ./docker/backend/Dockerfile
            args:
                PYTHON_VERSION: "3.13"
        container_name: mpmb-backend
        ports:
            - "8000:8000"
        volumes:
            - backend_logs:/app/logs
            - backend_index_cache:/app/data/index_cache
            - backend_uploads:/app/data/uploads
            # Source trees for the mpmb_read/grep/function tool roots (read-only)
            - ./data/mpmb_source:/app/data/mpmb_source:ro
            - ./data/mpmb_source_2024:/app/data/mpmb_source_2024:ro
            - ./data/imports_source:/app/data/imports_source:ro
            # Analyzer report for the source catalog (symbol index, layer-1 intent, prompt hints)
            - ./scripts/analyze/reports:/app/scripts/analyze/reports:ro
            # Warm model cache from the host - removes the first-search cold start
            - ./data/models:/app/data/models
            # Persist settings across recreations
            - ./data/settings.json:/app/data/settings.json
        environment:
            # Application
            - ENVIRONMENT=development
            - LOG_LEVEL=INFO
            - DEBUG=true

            # Auth fail-safe exposure: the container binds 0.0.0.0 (required); setup then demands the logged token
            - BIND_HOST=0.0.0.0

            # Database
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_USER=${POSTGRES_USER:-mpmb_user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mpmb_password}
            - POSTGRES_DB=${POSTGRES_DB:-mpmb_copilot}
            - DATABASE_URL=postgresql://${POSTGRES_USER:-mpmb_user}:${POSTGRES_PASSWORD:-mpmb_password}@postgres:5432/${POSTGRES_DB:-mpmb_copilot}

            # Qdrant
            - QDRANT_HOST=qdrant
            - QDRANT_PORT=6333
            - QDRANT_COLLECTION=mpmb_code

            # LLM Providers
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
            - OPENAI_API_KEY=${OPENAI_API_KEY:-}
            - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
            - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-anthropic}
            - DEFAULT_MODEL=${DEFAULT_MODEL:-claude-sonnet-4-20250514}
        env_file:
            - .env
        depends_on:
            - postgres
            - qdrant
        extra_hosts:
            # Docker Desktop resolves to host.docker.internal, linux needs the additional mapping
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
        networks:
            - mpmb-network

networks:
    mpmb-network:
        driver: bridge
        name: mpmb-network

volumes:
    # PostgreSQL persistent storage
    postgres_data:
        driver: local
        name: mpmb_postgres_data

    # Qdrant persistent storage
    qdrant_storage:
        driver: local
        name: mpmb_qdrant_storage

    qdrant_snapshots:
        driver: local
        name: mpmb_qdrant_snapshots

    # Application logs
    backend_logs:
        driver: local
        name: mpmb_backend_logs

    backend_index_cache:
        driver: local
        name: mpmb_backend_index_cache

    backend_uploads:
        driver: local
        name: mpmb_backend_uploads

    hub_logs:
        driver: local
        name: mpmb_hub_logs
