name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    HUSKY: "0"
    UV_CACHE_DIR: .uv-cache

jobs:
    quality:
        name: Format, Lint, Test, and Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: npm

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Setup uv
              uses: astral-sh/setup-uv@v8
              with:
                  enable-cache: true
                  cache-dependency-glob: |
                      backend/uv.lock
                      scripts/analyze/uv.lock

            - name: Install Node dependencies
              run: npm ci

            - name: Sync backend dependencies
              run: uv sync --project backend --group dev --frozen

            - name: Run full repository checks
              run: npm run check:full

    frontend-build:
        name: Frontend Production Build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: npm

            - name: Install Node dependencies
              run: npm ci

            - name: Build frontend
              run: npm run frontend:build

            - name: Upload frontend dist artifact
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-dist
                  path: frontend/dist/
                  if-no-files-found: error
                  retention-days: 14

    docker-build:
        name: Backend Docker Build
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Validate Compose file
              run: docker compose config --quiet

            - name: Build backend image
              run: docker build -f docker/backend/Dockerfile -t mpmb-copilot-backend:${{ github.sha }} .

    analyzer-smoke:
        name: Standalone Analyzer Smoke Test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Setup uv
              uses: astral-sh/setup-uv@v8
              with:
                  enable-cache: true
                  cache-dependency-glob: scripts/analyze/uv.lock

            - name: Compile analyzer package
              run: python -m py_compile scripts/analyze/analyze-repos.py scripts/analyze/src/mpmb_repo_analyzer/__main__.py
