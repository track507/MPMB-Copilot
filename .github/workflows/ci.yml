name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    HUSKY: "0"
    UV_CACHE_DIR: .uv-cache
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    quality:
        name: Format, Lint, and Test
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Setup uv
              uses: astral-sh/setup-uv@v8.2.0
              with:
                  enable-cache: true
                  cache-dependency-glob: backend/uv.lock

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Sync backend dependencies
              run: uv sync --project backend --group dev --frozen

            - name: Run repository checks
              run: pnpm run check

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: vars.ENABLE_TYPECHECK == 'true'
        continue-on-error: true

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Setup uv
              uses: astral-sh/setup-uv@v8.2.0
              with:
                  enable-cache: true
                  cache-dependency-glob: backend/uv.lock

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Sync backend dependencies
              run: uv sync --project backend --group dev --frozen

            - name: Run type checks
              run: pnpm run typecheck

    frontend-build:
        name: Frontend Production Build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Build frontend
              run: pnpm run frontend:build

            - name: Upload frontend dist artifact
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-dist
                  path: frontend/dist/
                  if-no-files-found: error
                  retention-days: 14

    docker-build:
        name: Backend Docker Build
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create CI env file for Compose validation
              run: cp .env.example .env

            - name: Validate Compose file
              run: docker compose config --quiet

            - name: Build backend image
              run: docker build -f docker/backend/Dockerfile -t mpmb-copilot-backend:${{ github.sha }} .

    analyzer-smoke:
        name: Standalone Analyzer Smoke Test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Check analyzer presence
              id: analyzer
              shell: bash
              run: |
                  if [[ -f scripts/analyze/analyze-repos.py && -f scripts/analyze/src/mpmb_repo_analyzer/__main__.py ]]; then
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=false" >> "$GITHUB_OUTPUT"
                      echo "Analyzer files are not present in this commit; skipping smoke test."
                  fi

            - name: Compile analyzer package
              if: steps.analyzer.outputs.present == 'true'
              run: python -m py_compile scripts/analyze/analyze-repos.py scripts/analyze/src/mpmb_repo_analyzer/__main__.py
