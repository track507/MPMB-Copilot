name: Security

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    schedule:
        - cron: "23 9 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: security-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    LEFTHOOK: "0"
    UV_CACHE_DIR: .uv-cache
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        if: github.event_name == 'pull_request'
        continue-on-error: true
        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Review dependency changes
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: high
                  comment-summary-in-pr: always

    codeql:
        name: CodeQL
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            security-events: write
            actions: read

        strategy:
            fail-fast: false
            # ! actions scans the workflow files themselves, which is where the SHA-pinning policy lives or is lost
            matrix:
                language: [actions, javascript-typescript, python]

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Initialize CodeQL
              uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  languages: ${{ matrix.language }}
                  queries: security-extended,security-and-quality

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  category: /language:${{ matrix.language }}

    vulnerability-audit:
        name: Dependency and Filesystem Audit
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        continue-on-error: true
        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.13"

            - name: Setup uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  enable-cache: true
                  cache-dependency-glob: backend/uv.lock

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Create security report directory
              run: mkdir -p security-reports

            # ? Both audits exit non-zero when they find something, which is not a reason to fail the job
            # ! continue-on-error, never `|| true`: a masked crash looks identical to a clean audit
            - name: pnpm audit
              id: pnpm_audit
              continue-on-error: true
              run: pnpm audit --audit-level moderate --json > security-reports/npm-audit.json

            # ! --no-emit-project drops the `-e .` line; pip cannot install the repo root, which has no pyproject.toml
            - name: Export backend requirements
              run: uv export --project backend --all-groups --all-extras --frozen --format requirements.txt --no-hashes --no-emit-project --output-file security-reports/backend-requirements.txt

            - name: pip-audit
              id: pip_audit
              continue-on-error: true
              # ! The export is pinned by uv.lock; pip's resolver cannot install rapidocr-onnxruntime and writes no report
              run: uvx pip-audit -r security-reports/backend-requirements.txt --no-deps --disable-pip --format json --output security-reports/pip-audit.json

            # ! A report that exists means the tool ran; no report means it could not, and that must fail loudly
            - name: Assert the audits actually ran
              run: |
                  fail=0
                  [[ -s security-reports/npm-audit.json ]] || { echo "::error::pnpm audit produced no report"; fail=1; }
                  [[ -s security-reports/pip-audit.json ]] || { echo "::error::pip-audit produced no report"; fail=1; }
                  exit "$fail"

            - name: Summarize audit findings
              if: always()
              run: node scripts/audit-summary.mjs >> "$GITHUB_STEP_SUMMARY"

            - name: Trivy filesystem scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              continue-on-error: true
              with:
                  scan-type: fs
                  scan-ref: .
                  format: sarif
                  output: security-reports/trivy-fs.sarif
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: "0"

            - name: Upload Trivy SARIF to code scanning
              uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  sarif_file: security-reports/trivy-fs.sarif
                  category: trivy-fs

            - name: Upload security reports
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: security-reports
                  path: security-reports/
                  if-no-files-found: warn
                  retention-days: 30

    scorecard:
        name: OpenSSF Scorecard
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        continue-on-error: true
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        permissions:
            contents: read
            security-events: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create security report directory
              run: mkdir -p security-reports

            - name: Run Scorecard
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: security-reports/scorecard.sarif
                  results_format: sarif
                  publish_results: false

            - name: Upload Scorecard SARIF
              uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  sarif_file: security-reports/scorecard.sarif
                  category: openssf-scorecard

            - name: Upload Scorecard report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: scorecard-report
                  path: security-reports/scorecard.sarif
                  if-no-files-found: warn
                  retention-days: 30
