version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "08:00"
      open-pull-requests-limit: 5
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "08:15"
      open-pull-requests-limit: 5
      groups:
          frontend-minor-patch:
              update-types: ["minor", "patch"]
          types:
              patterns: ["@types/*"]
      ignore:
          # ! TypeScript 7 is the native Go port, and the lint toolchain still reads ts.ModuleKind off the JS build
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: uv
      directory: /backend
      schedule:
          interval: weekly
          day: monday
          time: "08:45"
      open-pull-requests-limit: 5
      groups:
          backend-minor-patch:
              update-types: ["minor", "patch"]
      ignore:
          - dependency-name: "nvidia-*"

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
      open-pull-requests-limit: 5

    - package-ecosystem: docker
      directory: /docker/backend
      schedule:
          interval: weekly
          day: monday
          time: "09:15"
      open-pull-requests-limit: 5
