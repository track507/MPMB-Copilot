version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "08:00"
      open-pull-requests-limit: 5

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "08:15"
      open-pull-requests-limit: 5

    - package-ecosystem: uv
      directory: /backend
      schedule:
          interval: weekly
          day: monday
          time: "08:45"
      open-pull-requests-limit: 5
      ignore:
          - dependency-name: "nvidia-*"

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
      open-pull-requests-limit: 5

    - package-ecosystem: docker
      directory: /docker/backend
      schedule:
          interval: weekly
          day: monday
          time: "09:15"
      open-pull-requests-limit: 5
