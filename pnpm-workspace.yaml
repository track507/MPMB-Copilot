packages:
    - frontend
    - scripts/analyze
    - scripts/validate
allowBuilds:
    esbuild: true
    lefthook: true

minimumReleaseAge: 1440
blockExoticSubdeps: true
saveExact: true
engineStrict: true
pmOnFail: download

catalog:
    "@eslint/js": 10.0.1
    "@types/node": 26.6.6
    eslint: 10.14.0
    globals: 17.14.0
    temporal-polyfill: 1.0.8
    typescript: 6.0.3
    vitest: 5.1.0
    "@vitest/coverage-v8": 5.1.0
