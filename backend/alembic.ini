[alembic]
script_location = alembic

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

; ! alembic logs progress at INFO, so root at WARN swallows every "Running upgrade" line
[logger_alembic]
level = INFO
handlers =
qualname = alembic

; ? Engine chatter stays off for CLI runs; the app turns it on separately via its own logging setup
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
