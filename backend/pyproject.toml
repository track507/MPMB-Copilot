[project]
name = "mpmb-copilot-backend"
version = "0.1.0"
description = "RAG-powered assistant for MPMB character sheet development"
# readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"fastapi>=0.109.0",
	"uvicorn[standard]>=0.27.0",
	"pydantic>=2.6.0",
	"pydantic-settings>=2.1.0",
	"python-dotenv>=1.0.0",
	"httpx>=0.26.0",

	# Database (PostgreSQL)
	"asyncpg>=0.29.0",
	"sqlalchemy>=2.0.25",
	"alembic>=1.13.0",
	"psycopg2-binary>=2.9.9",

	# RAG & Embeddings
	"qdrant-client>=1.14.0",
	"fastembed>=0.7.4",
	"sentence-transformers>=2.3.0",
	"langchain>=0.1.0",
	"langchain-community>=0.0.13",

	# LLM Providers
	"langchain-core>=1.2.23",
	"langchain-anthropic>=1.4.0",
	"langchain-openai>=1.1.12",
	"langchain-ollama>=1.0.1",

	# Logging
	"structlog>=24.0.0",

	# Utilities
	"python-multipart>=0.0.6",
	"aiofiles>=23.2.1",
	"beautifulsoup4>=4.12.0",
	"pypdf>=4.0.0",
	"tiktoken>=0.5.0",
	"python-magic>=0.4.27",
	"pillow>=10.2.0",
	"uuid-utils>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["/app", "/tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["structlog", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
	"httpx-ws>=0.8.2",
	"mypy>=1.19.1",
	"pytest>=9.0.2",
	"pytest-asyncio>=1.3.0",
	"pytest-cov>=7.0.0",
	"ruff>=0.14.10",
]
