[project]
name = "mpmb-copilot-backend"
version = "0.2.0"
description = "RAG-powered assistant for MPMB character sheet development"
# readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"fastapi>=0.109.0",
	"uvicorn[standard]>=0.27.0",
	"pydantic>=2.6.0",
	"pydantic-settings>=2.1.0",
	"python-dotenv>=1.0.0",
	"httpx>=0.26.0",
	# Database (PostgreSQL)
	"asyncpg>=0.29.0",
	"sqlalchemy>=2.0.25",
	"alembic>=1.13.0",
	"psycopg2-binary>=2.9.9",
	# RAG & Embeddings
	"qdrant-client>=1.14.0",
	"fastembed>=0.7.4",
	# GPU-capable ONNX runtime on Windows (DirectML; superset of the CPU build)
	"onnxruntime-directml>=1.24; sys_platform == 'win32'",
	# LLM Providers
	"pydantic-ai-slim[anthropic,openai]>=1.107.0",
	# Logging
	"structlog>=24.0.0",
	# Utilities
	"python-multipart>=0.0.6",
	"aiofiles>=23.2.1",
	"beautifulsoup4>=4.12.0",
	"pypdf>=4.0.0",
	"tiktoken>=0.5.0",
	"python-magic>=0.4.27",
	"pillow>=10.2.0",
	"uuid-utils>=0.12.0",
	"argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
# Optional sbert embedding provider. Pulls torch (~10 GB with CUDA wheels);
# install only if embedding_provider=sbert: uv sync --extra sbert
sbert = ["sentence-transformers>=5.5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["/app", "/tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["structlog", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"

[dependency-groups]
dev = [
	"httpx-ws>=0.8.2",
	"mypy>=1.19.1",
	"pytest>=9.0.2",
	"pytest-asyncio>=1.3.0",
	"pytest-cov>=7.0.0",
	"ruff>=0.14.10",
]

[tool.uv]
# ! onnxruntime distributions all provide the same module and must not coexist: on Windows the DirectML build (declared above) replaces fastembed's plain onnxruntime
override-dependencies = ["onnxruntime>=1.22; sys_platform != 'win32'"]
