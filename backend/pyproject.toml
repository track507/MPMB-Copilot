[project]
name = "mpmb-copilot-backend"
version = "0.1.0"
description = "RAG-powered assistant for MPMB character sheet development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.109.0",
	"uvicorn[standard]>=0.27.0",
	"pydantic>=2.6.0",
	"pydantic-settings>=2.1.0",
	"python-dotenv>=1.0.0",
	"httpx>=0.26.0",
	# RAG & Embeddings
	"qdrant-client>=1.7.0",
	"sentence-transformers>=2.3.0",
	"langchain>=0.1.0",
	"langchain-community>=0.0.13",
	# LLM Providers
	"openai>=1.10.0",
	"anthropic>=0.18.0",
	# Utilities
	"python-multipart>=0.0.6",
	"aiofiles>=23.2.1",
	"beautifulsoup4>=4.12.0",
	"pypdf>=4.0.0",
	"tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0.0",
	"pytest-asyncio>=0.23.0",
	"pytest-cov>=4.1.0",
	"black>=24.1.0",
	"ruff>=0.2.0",
	"mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
	"/app",
	"/tests",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
